<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Consider: find someone worth getting to know. A prototype of a private, matchmaker-led introduction service.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Consider</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one quiet reading column for members (max 720px), a wider ledger for staff; phone gets a bottom tab bar, desktop a top bar. */
:root{
  --bg:#F3F0EA; --surface:#FBFAF7; --sunk:#EAE5DC; --ink:#17233A; --muted:#67645D; --line:#DCD5C8;
  --navy:#1D3253; --navy-soft:#E2E7EF; --on-navy:#F7F4EE; --brass:#94703F;
  --ok:#36704F; --ok-soft:#E0EDE4; --warn:#94601A; --warn-soft:#F4E9D6; --bad:#9B4136; --bad-soft:#F3E0DC;
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(23,35,58,.06),0 8px 24px rgba(23,35,58,.06);
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem; --fs-2xl:2.125rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#151F33; --sunk:#1B2740; --ink:#ECE6DC; --muted:#A39D92; --line:#2B3854;
  --navy:#C7D4EA; --navy-soft:#22314F; --on-navy:#0F1830; --brass:#D2AC77;
  --ok:#86C7A1; --ok-soft:#1C3328; --warn:#E3B06A; --warn-soft:#3A2D19; --bad:#E8968B; --bad-soft:#3C2320;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#151F33; --sunk:#1B2740; --ink:#ECE6DC; --muted:#A39D92; --line:#2B3854;
  --navy:#C7D4EA; --navy-soft:#22314F; --on-navy:#0F1830; --brass:#D2AC77;
  --ok:#86C7A1; --ok-soft:#1C3328; --warn:#E3B06A; --warn-soft:#3A2D19; --bad:#E8968B; --bad-soft:#3C2320;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-md);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.2;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:var(--fs-2xl);letter-spacing:-.01em}
h2{font-size:var(--fs-xl)}
h3{font-size:var(--fs-lg)}
p{margin:0}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:var(--fs-sm)} .xs{font-size:var(--fs-xs)}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600}
.label{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:600;font-size:1.45rem;letter-spacing:-.01em;color:var(--navy)}
.brand span{font-size:var(--fs-sm);color:var(--muted);font-style:italic;font-family:var(--display)}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav button,.tabbar button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500}
.topnav button{padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center}
.topnav button[aria-current="page"]{color:var(--navy);background:var(--navy-soft)}
.topnav button:hover{color:var(--ink)}
.badge-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brass);color:var(--surface);font-size:11px;font-weight:700}
.tabbar{display:none}
@media (max-width:760px){
  .brand span{display:none}
  .topnav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;position:relative}
  .tabbar button[aria-current="page"]{color:var(--navy)}
  .tabbar .badge-n{position:absolute;top:0;left:calc(50% + 6px)}
  .main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))!important}
}
.tabbar svg,.topnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.topnav svg{width:17px;height:17px}

.main{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main.wide{max-width:1120px}
.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.page-head p{color:var(--muted);max-width:62ch}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy);filter:none}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);padding:0 10px}
.btn.quiet:hover{color:var(--ink);filter:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:34px;padding:0 12px;font-size:var(--fs-sm)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
input[disabled]{opacity:.7}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.field-head label{font-weight:600;font-size:var(--fs-sm)}
.opt{font-weight:400;color:var(--muted)}
.help{font-size:var(--fs-sm);color:var(--muted)}
.err{font-size:var(--fs-sm);color:var(--bad);font-weight:500}
.has-err input,.has-err select,.has-err textarea,.has-err .chips{border-color:var(--bad)}
.vis{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--muted)}
.vis select{min-height:28px;padding:2px 24px 2px 8px;font-size:var(--fs-xs);width:auto;border-radius:6px}
.vis.fixed{padding:3px 8px;border-radius:6px;background:var(--sunk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-radius:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-sm);background:var(--surface);transition:background .15s,border-color .15s}
.chip input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.chips.dense .chip span{padding:4px 9px;font-size:var(--fs-xs)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{text-align:center}
.scale .chip span{display:block;border-radius:8px;padding:8px 4px;font-size:var(--fs-xs)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel{border-top:1px solid var(--line);padding-top:20px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--navy-soft);color:var(--ink);font-size:var(--fs-sm);margin-bottom:20px}
.banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.ok{background:var(--ok-soft)}
.banner strong{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.navy{background:var(--navy-soft);color:var(--navy)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--brass);font-weight:600}
.lock svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:var(--fs-lg)}
.empty p{color:var(--muted);max-width:44ch}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* auth */
.auth{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start;padding-top:20px}
@media (max-width:860px){.auth{grid-template-columns:1fr;gap:28px}}
.auth-intro{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.auth-intro h1{font-size:clamp(2rem,5vw,3rem);font-weight:400;letter-spacing:-.02em}
.auth-intro h1 em{font-style:italic;color:var(--navy)}
.lede{font-size:var(--fs-lg);color:var(--muted);max-width:52ch;font-family:var(--display)}
.principles{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.principles li{display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:var(--fs-md)}
.principles b{font-family:var(--display);color:var(--brass);font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);font-size:var(--fs-sm)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.demo-list{display:grid;gap:8px}
.demo-btn{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.demo-btn:hover{border-color:var(--navy)}
.demo-btn img{width:36px;height:44px;border-radius:6px;object-fit:cover}
.demo-btn strong{display:block;font-size:var(--fs-sm)}
.demo-btn span{font-size:var(--fs-xs);color:var(--muted)}

/* wizard */
.wiz-progress{display:flex;gap:4px;margin:14px 0 6px}
.wiz-progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-progress i.on{background:var(--navy)}
.wiz-progress i.cur{background:var(--brass)}
.wiz-steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.wiz-steps button{flex:none;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:var(--fs-xs);cursor:pointer;color:var(--muted)}
.wiz-steps button[aria-current="step"]{border-color:var(--navy);color:var(--navy);font-weight:600}
.group-h{font-family:var(--display);font-size:var(--fs-lg);padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.photo-field{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-field img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.crit{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.crit-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.crit-head strong{font-weight:600}
.crit-head select{width:auto;min-height:34px;padding:4px 30px 4px 10px;font-size:var(--fs-sm)}
.crit.off .crit-body{opacity:.55}
.lvl-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
@media (max-width:560px){.lvl-legend{grid-template-columns:1fr 1fr}}
.lvl-legend div{padding:10px;border-radius:8px;background:var(--sunk);font-size:var(--fs-xs)}
.lvl-legend b{display:block;font-size:var(--fs-sm);color:var(--ink)}
.states-box{max-height:150px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:8px}

/* discovery cards */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select{width:auto;min-height:38px;font-size:var(--fs-sm)}
.filters .switch{font-size:var(--fs-sm);align-items:center}
.filters .switch input{margin:0}
.cards{display:grid;gap:18px}
.pcard{display:grid;grid-template-columns:132px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pc-photo{position:relative;background:var(--sunk)}
.pc-photo img{width:100%;aspect-ratio:4/5;height:auto;object-fit:cover;display:block}
.pc-photo .withheld{position:absolute;left:8px;right:8px;bottom:8px;font-size:10px;line-height:1.3;color:#F4EFE6;background:rgba(15,24,48,.55);padding:4px 6px;border-radius:4px}
.pc-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pc-name{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pc-name h3{font-size:1.35rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:var(--fs-sm)}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0}
.tagline{font-size:var(--fs-sm)}
.align-hint{font-size:var(--fs-sm);color:var(--ok);font-weight:500}
.ess{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ess span.t{font-size:var(--fs-xs);padding:2px 8px;border-radius:5px;background:var(--sunk)}
.pc-actions{grid-column:1/-1;display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pc-actions .btn{flex:1}
.pc-actions .btn.quiet{flex:0 0 auto}
@media (max-width:480px){.pcard{grid-template-columns:104px 1fr}.pc-body{padding:14px}}

/* person */
.person-head{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:start}
@media (max-width:560px){.person-head{grid-template-columns:110px 1fr;gap:16px}}
.person-head img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);max-width:100%}
.person-head h1{font-size:clamp(1.7rem,5vw,2.4rem)}
.section{padding-block:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.section>h2{font-size:var(--fs-xl)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px 18px;margin:0}
@media (max-width:480px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.kv dt{color:var(--muted);font-size:var(--fs-sm)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.quote{font-family:var(--display);font-size:var(--fs-lg);line-height:1.5;border-left:2px solid var(--brass);padding-left:16px}
.compat{display:grid;gap:14px}
.cgroup{border-radius:var(--r);padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.cgroup h3{font-family:var(--body);font-size:var(--fs-sm);font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cgroup h3::before{content:"";width:8px;height:8px;border-radius:50%}
.cgroup.strong h3{color:var(--ok)} .cgroup.strong h3::before{background:var(--ok)}
.cgroup.diff h3{color:var(--bad)} .cgroup.diff h3::before{background:var(--bad)}
.cgroup.discuss h3{color:var(--warn)} .cgroup.discuss h3::before{background:var(--warn)}
.cgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cgroup li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cgroup li:first-child{border-top:0;padding-top:2px}
.cgroup li b{font-size:var(--fs-sm);font-weight:600}
.cgroup li p{font-size:var(--fs-sm);color:var(--muted)}
.assist{background:var(--navy-soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.assist .row .btn{background:var(--surface)}
.ai-out{background:var(--surface);border-radius:8px;padding:14px 16px;font-size:var(--fs-md);display:flex;flex-direction:column;gap:8px}
.ai-out ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.ai-src{font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

/* connections */
.conn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.conn-top{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center}
.conn-top img{width:52px;height:64px;object-fit:cover;border-radius:6px}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:2px}
.steps li{list-style:none;flex:1;min-width:84px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);position:relative}
.steps li::before{content:"";height:3px;background:var(--line);margin-right:4px;border-radius:2px}
.steps li.done{color:var(--ink)} .steps li.done::before{background:var(--navy)}
.steps li.cur{color:var(--brass);font-weight:700} .steps li.cur::before{background:var(--brass)}
.steps ol,.steps{margin:0;padding:0}
.note{font-size:var(--fs-sm);padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.note .label{display:block;margin-bottom:4px}
.mini{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini img{width:40px;height:50px;object-fit:cover;border-radius:5px}

/* thread */
.thread-head{display:grid;grid-template-columns:auto 44px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.thread-head img{width:44px;height:54px;border-radius:6px;object-fit:cover}
.msgs{display:flex;flex-direction:column;gap:10px;padding:16px 0;min-height:200px}
.msg{max-width:min(78%,520px);padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}

.sysmsg{align-self:center;font-size:var(--fs-xs);color:var(--muted);text-align:center;max-width:46ch}

/* staff */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}

.stat{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--sunk);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-family:var(--body);font-size:var(--fs-sm);font-weight:700;display:flex;justify-content:space-between}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.icard:hover{border-color:var(--navy)}
.icard strong{font-size:var(--fs-sm)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm);min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td select{min-height:32px;padding:2px 28px 2px 8px;width:auto;font-size:var(--fs-sm)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:var(--fs-sm)}

.private-tag{background:var(--warn-soft);color:var(--warn);font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.45);display:grid;place-items:end center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{place-items:center}}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}

.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.toast.bad{background:var(--bad);color:var(--surface)}
.foot-note{margin-top:40px;font-size:var(--fs-xs);color:var(--muted);text-align:center}

<script>
(()=>{

 {key:'heightCm',step:'about',label:'Height (cm)',type:'number',min:120,max:230,vis:'members',opts:['members','connected','private']},
 {key:'education',step:'about',label:'Highest education',type:'select',options:EDU,req:1,vis:'members',opts:['members','connected']},
 {key:'study',step:'about',label:'Field of study',type:'text',vis:'members',opts:['members','connected'],max:60},
 {key:'job',step:'about',label:'Work',type:'text',req:1,vis:'members',opts:['members','connected'],max:80,ph:'e.g. Registered nurse'},

 {key:'languages',step:'about',label:'Languages',type:'chips',options:LANGS,req:1,vis:'members',opts:['members','connected'],group:'Personality & interests'},
 {key:'energy',step:'about',label:'Social energy',type:'scale',options:ENERGY,req:1,vis:'members',opts:['members','connected']},

 {key:'ftta',step:'faith',label:'Full-time training (FTTA)',type:'select',options:FTTA,req:1,vis:'members',opts:['members','connected']},
 {key:'service',step:'faith',label:'Service and ministry involvement',type:'chips',options:SERVICE,vis:'members',opts:['members','connected']},
 {key:'serviceNotes',step:'faith',label:'About your service',type:'textarea',vis:'members',opts:['members','connected'],max:600},
 {key:'citizenship',step:'life',label:'Citizenship',type:'text',vis:'private',opts:['members','connected','private'],max:60},
 {key:'visa',step:'life',label:'Visa status',type:'text',vis:'private',opts:['connected','private'],max:80,help:'Private by default. Matchmakers may need it to plan introductions responsibly.'},
 {key:'marriageStatus',step:'life',label:'Current marital status',type:'select',options:MARSTAT,req:1,vis:'members',opts:['members','connected']},
 {key:'everMarried',step:'life',label:'Have you been married before?',type:'select',options:EVER,req:1,vis:'members',opts:['members','connected']},
 {key:'children',step:'life',label:'Children in the future',type:'select',options:CHILDREN,req:1,vis:'members',opts:['members','connected'],group:'Looking ahead'},
 {key:'timeline',step:'life',label:'Marriage timeline',type:'select',options:TIMELINE,req:1,vis:'members',opts:['members','connected']},
 {key:'relocate',step:'life',label:'Open to relocating?',type:'select',options:RELOCATE,req:1,vis:'members',opts:['members','connected']},
 {key:'healthSummary',step:'health',label:'Health in general',type:'select',options:HEALTH,req:1,vis:'connected',opts:['members','connected','private']},
 {key:'healthDetail',step:'health',label:'Relevant health information',type:'textarea',vis:'private',opts:['connected','private'],max:800,help:'Anything a future spouse would reasonably want to know in time. Private to you and matchmakers unless you change it.'},
 {key:'additionalInfo',step:'other',label:'Additional information',type:'textarea',vis:'members',opts:['members','connected'],max:1200,ph:'Family, background, what a normal week looks like…'},
 {key:'lookingFor',step:'other',label:'What I am looking for',type:'textarea',req:1,vis:'members',opts:['members','connected'],max:800}
];
const FIELD=Object.fromEntries(FIELDS.map(f=>[f.key,f]));
const CONTACT_KEYS=['email','phone','address'];

const CRIT=[
 {key:'faithYears',cat:'faith',label:'Years in the church life (at least)',type:'number',min:0,max:60},
 {key:'ftta',cat:'faith',label:'Full-time training',type:'set',options:FTTA.slice(0,4)},
 {key:'serving',cat:'faith',label:'Actively serving in the church',type:'bool'},
 {key:'values',cat:'character',label:'Character & values',type:'set',options:VALUES},
 {key:'children',cat:'family',label:'Children in the future',type:'set',options:CHILDREN},
 {key:'timeline',cat:'family',label:'Marriage timeline',type:'set',options:TIMELINE},
 {key:'married',cat:'family',label:'Marital history',type:'set',options:EVER},
 {key:'age',cat:'family',label:'Age range',type:'range',min:18,max:80,unit:'years'},
 {key:'traits',cat:'personality',label:'Personality traits',type:'set',options:TRAITS},
 {key:'energy',cat:'personality',label:'Social energy',type:'set',options:ENERGY},
 {key:'lifestyle',cat:'lifestyle',label:'Lifestyle',type:'set',options:LIFESTYLE},
 {key:'education',cat:'lifestyle',label:'Education (at least)',type:'select',options:EDU},
 {key:'location',cat:'location',label:'Location (states)',type:'states'},
 {key:'languages',cat:'other',label:'Shared language',type:'set',options:LANGS},
 {key:'height',cat:'other',label:'Height range',type:'range',min:120,max:230,unit:'cm'},
 {key:'nationality',cat:'other',label:'Nationality',type:'text',ph:'Comma-separated, e.g. American, Canadian'}
];
const CRITD=Object.fromEntries(CRIT.map(c=>[c.key,c]));

/* ============================== Utilities ============================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const now=()=>Date.now();
const DAY=864e5;
const list=a=>{a=(a||[]).filter(Boolean);if(a.length<2)return a.join('');return a.slice(0,-1).join(', ')+(a.length>2?',':'')+' and '+a[a.length-1]};
const lcFirst=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
const inter=(a,b)=>(a||[]).filter(x=>(b||[]).includes(x));
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const isNum=x=>typeof x==='number'&&!isNaN(x);
function ageOf(p){if(!p.birthYear)return null;const d=new Date();let a=d.getFullYear()-p.birthYear;if((d.getMonth()+1)<(p.birthMonth||1))a--;return a}
function ageBand(age){if(age==null)return null;const dec=Math.floor(age/10)*10,d=age-dec;const part=d<=3?'Early':d<=6?'Mid':'Late';const lo=dec+(d<=3?0:d<=6?4:7),hi=dec+(d<=3?3:d<=6?6:9);return{label:`${part} ${dec}s`,lo,hi}}
function pro(p){return p&&p.gender==='Sister'?{sub:'she',obj:'her',pos:'her',Sub:'She'}:{sub:'he',obj:'him',pos:'his',Sub:'He'}}
function ftIn(cm){const i=Math.round(cm/2.54);return`${Math.floor(i/12)}′${i%12}″`}
function ago(t){const s=(now()-t)/1000;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)} min ago`;if(s<86400)return`${Math.floor(s/3600)} h ago`;if(s<7*86400)return`${Math.floor(s/86400)} d ago`;return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function clock(t){return new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function monogram(name,id){const cols=['#2C4770','#6B4E3D','#3E5C55','#7A5C3A','#4B4F6B','#5C3F4F'];let h=0;for(const c of String(id||name))h=(h*31+c.charCodeAt(0))>>>0;const ini=esc(String(name||'?').trim().charAt(0).toUpperCase()||'?');return'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150"><rect width="120" height="150" fill="${cols[h%cols.length]}"/><text x="60" y="94" font-family="Georgia,serif" font-size="58" fill="#F4EFE6" text-anchor="middle">${ini}</text></svg>`)}
const photoOf=p=>p&&p.photo?p.photo:monogram(p?p.firstName:'?',p?p.id:'x');
async function hashPw(pw,salt){const data=new TextEncoder().encode(salt+':'+pw);try{if(crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(const b of data)h=((h<<5)+h+b)|0;return'f'+(h>>>0).toString(16)}
const salt=()=>Math.random().toString(36).slice(2,10);

/* ============================== Validation (shared by UI and API) ============================== */
function validateFields(fields,data){
  const e={};
  for(const f of fields){
    if(f.type==='email'||f.type==='photo')continue;
    if(f.type==='monthyear'){
      if(!data.birthMonth||!data.birthYear){if(f.req)e.birth='Choose your birth month and year.';continue}
      const a=ageOf(data);if(a<18)e.birth='Consider is for adults 18 and over.';else if(a>90)e.birth='Check the year you entered.';continue;
    }
    const v=data[f.key];
    const empty=v==null||v===''||(Array.isArray(v)&&!v.length);
    if(empty){if(f.req)e[f.key]=f.type==='chips'?'Choose at least one.':f.type==='select'||f.type==='scale'?'Choose an option.':'This is required.';continue}
    if(f.type==='number'){if(!isNum(v))e[f.key]='Enter a number.';else if(v<f.min||v>f.max)e[f.key]=`Enter a value between ${f.min} and ${f.max}.`}
    if(f.type==='chips'&&f.maxSel&&v.length>f.maxSel)e[f.key]=`Choose up to ${f.maxSel}.`;
    if(f.type==='tel'&&v&&!/^[0-9+()\-.\s]{7,30}$/.test(v))e[f.key]='Use digits, spaces and + ( ) - only.';
    if(f.type==='select'&&f.options&&!f.options.includes(v))e[f.key]='Choose an option from the list.';
  }
  return e;
}

/* ============================== Storage ============================== */
const Store=(()=>{
  const KEY='consider.mvp.v1';let db=null,persistent=true;
  const read=()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){persistent=false;return null}};
  const write=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));persistent=true;return true}catch(e){persistent=false;return false}};
  return{
    async init(){db=read();if(!db||db.version!==1){db=await buildSeed();write()}},
    get:()=>db,commit:write,isPersistent:()=>persistent,
    async reset(){db=await buildSeed();write()}
  };
})();

/* ============================== Compatibility engine (pure) ============================== */
function crValueText(def,val){
  if(def.type==='range')return`${val[0]}–${val[1]} ${def.unit}`;
  if(def.type==='number')return`at least ${val}`;
  if(def.type==='bool')return'actively serving';
  if(def.type==='select')return`${val} or higher`;
  if(def.type==='states')return list(val);
  if(def.type==='text')return val;
  return list(val.map(lcFirst));
}
function evalCrit(def,val,t){
  const T=t.firstName,P=pro(t);
  const r=(status,detail)=>({status,detail});
  switch(def.key){
    case'age':{const b=t.ageBand;if(!b)return r('unknown',`${T}’s age isn’t shown.`);const ex=isNum(t.age)?`${T} is ${t.age}.`:`${T} is in ${P.pos} ${b.label.toLowerCase()}.`;
      if(isNum(t.age))return r(t.age>=val[0]&&t.age<=val[1]?'met':(t.age>=val[0]-2&&t.age<=val[1]+2?'partial':'unmet'),ex);
      if(b.lo>=val[0]&&b.hi<=val[1])return r('met',ex);if(b.hi<val[0]||b.lo>val[1])return r('unmet',ex);return r('partial',ex)}
    case'faithYears':{if(!isNum(t.yearsInChurch))return r('unknown',`${T} hasn’t shared this.`);const y=t.yearsInChurch;return r(y>=val?'met':y>=val-2?'partial':'unmet',`${T} has been in the church life about ${y} years.`)}
    case'ftta':{if(!t.ftta)return r('unknown',`${T} hasn’t shared this.`);if(t.ftta===FTTA[4])return r('unknown',`${T} would prefer to discuss training in person.`);return r(val.includes(t.ftta)?'met':'unmet',`${T}: ${lcFirst(t.ftta)}.`)}
    case'serving':{if(!t.service)return r('unknown',`${T} hasn’t shared this.`);return r(t.service.length?'met':'unmet',t.service.length?`${T} serves in ${list(t.service.map(lcFirst))}.`:`${T} hasn’t listed a current service.`)}

  }
  return r('unknown','');
}

function compatCore(v,t,vCrit,tCrit,vSeen){

  const cats={};
  const set=(k,parts,bits,known=true)=>{cats[k]={sim:avg(parts),text:bits.filter(Boolean).join(' '),known:known&&parts.some(x=>x!=null)}};
  // Faith
  {const parts=[],bits=[];
    if(isNum(v.yearsInChurch)&&isNum(t.yearsInChurch)){const d=Math.abs(v.yearsInChurch-t.yearsInChurch);parts.push(1-Math.min(d,12)/12*.6);bits.push(`You’ve been in the church life about ${v.yearsInChurch} years; ${T}, about ${t.yearsInChurch}.`)}

    const sv=v.service||[],st=t.service;

    if(v.locality&&t.locality&&v.locality.trim().toLowerCase()===t.locality.trim().toLowerCase())bits.push(`You meet in the same locality, ${t.locality}.`);
    set('faith',parts,bits)}
  // Family goals
  {const parts=[],bits=[];
    const M={'0,0':1,'0,1':.72,'1,1':.85,'0,2':.5,'1,2':.65,'2,2':.6,'0,3':0,'1,3':.4,'2,3':.45,'3,3':1};
    if(v.children&&t.children){const a=CHILDREN.indexOf(v.children),b=CHILDREN.indexOf(t.children);parts.push(M[[Math.min(a,b),Math.max(a,b)].join(',')]);bits.push(a===b?`On children, you’re both “${lcFirst(v.children)}”.`:`On children, you said “${lcFirst(v.children)}”; ${T} said “${lcFirst(t.children)}”.`)}
    if(v.timeline&&t.timeline){const a=TIMELINE.indexOf(v.timeline),b=TIMELINE.indexOf(t.timeline);parts.push(a===b?1:(a===2||b===2)?.75:.55);bits.push(a===b?`You share a similar sense of timing.`:`Your timelines differ a little: “${lcFirst(v.timeline)}” and “${lcFirst(t.timeline)}”.`)}
    set('family',parts,bits)}
  // Character & values
  {const parts=[],bits=[];if(v.values&&t.values&&v.values.length&&t.values.length){const o=inter(v.values,t.values);parts.push(Math.min(1,o.length/Math.min(3,v.values.length,t.values.length)));bits.push(o.length?`You both named ${list(o.map(lcFirst))} among the values you hold.`:`You named ${list(v.values.map(lcFirst))}; ${T} named ${list(t.values.map(lcFirst))}. Different words can still describe shared priorities.`)}set('character',parts,bits)}
  // Lifestyle
  {const parts=[],bits=[];if(v.lifestyle&&t.lifestyle&&v.lifestyle.length&&t.lifestyle.length){const o=inter(v.lifestyle,t.lifestyle);let s=Math.min(1,o.length/Math.min(2,v.lifestyle.length,t.lifestyle.length));const clash=[['Early riser','Night owl'],['Urban','Suburban'],['Homebody','Frequent travel']].filter(([a,b])=>(v.lifestyle.includes(a)&&t.lifestyle.includes(b))||(v.lifestyle.includes(b)&&t.lifestyle.includes(a)));s=Math.max(0,s-.25*clash.length);parts.push(s);
    if(o.length)bits.push(`You both describe your life as ${list(o.map(lcFirst))}.`);clash.forEach(([a,b])=>bits.push(`One of you is ${a.toLowerCase()} and the other ${b.toLowerCase()}.`));if(!o.length&&!clash.length)bits.push(`Your lifestyles are described differently: ${list(v.lifestyle.map(lcFirst))} and ${list(t.lifestyle.map(lcFirst))}.`)}
    if(v.education&&t.education){const d=Math.abs(EDU.indexOf(v.education)-EDU.indexOf(t.education));parts.push(1-d*.15)}
    set('lifestyle',parts,bits)}
  // Personality
  {const parts=[],bits=[];if(isNum(v.energy)&&isNum(t.energy)){const d=Math.abs(v.energy-t.energy);parts.push(1-d/4*.8);bits.push(d===0?`You both describe your social energy as ${ENERGY[v.energy-1].toLowerCase()}.`:`You describe yourself as ${ENERGY[v.energy-1].toLowerCase()}; ${T}, as ${ENERGY[t.energy-1].toLowerCase()}.`)}
    if(v.traits&&t.traits&&t.traits.length){const o=inter(v.traits,t.traits);parts.push(Math.min(1,.45+o.length*.28));if(o.length)bits.push(`You share ${list(o.map(lcFirst))} as traits.`);else bits.push(`${T} describes ${P.obj}self as ${list(t.traits.map(lcFirst))}.`)}
    set('personality',parts,bits)}
  // Location
  {const parts=[],bits=[];if(v.state&&t.state){if(v.city&&t.city&&v.city.toLowerCase()===t.city.toLowerCase()&&v.state===t.state){parts.push(1);bits.push(`You both live in ${t.city}, ${t.state}.`)}
    else if(v.state===t.state){parts.push(.8);bits.push(`You both live in ${t.state === 'Outside US' ? 'the same region' : t.state}${v.city&&t.city?` (${v.city} and ${t.city})`:''}.`)}
    else{const rv=v.relocate,rt=t.relocate;const s=(rv==='Yes'||rt==='Yes')?.55:(rv==='Possibly'||rt==='Possibly')?.4:.12;parts.push(s);bits.push(`You’re in ${v.city?v.city+', ':''}${v.state}; ${T} is in ${t.city?t.city+', ':''}${t.state}.${rt?` ${T} ${rt==='Yes'?'is open':rt==='Possibly'?'is possibly open':'isn’t looking'} to relocate.`:''}`)}}
    set('location',parts,bits)}
  // Interests
  {const parts=[],bits=[];if(v.hobbies&&t.hobbies&&v.hobbies.length&&t.hobbies.length){const o=inter(v.hobbies,t.hobbies);parts.push(Math.min(1,.25+o.length*.3));bits.push(o.length?`You both enjoy ${list(o.map(lcFirst))}.`:`${T} enjoys ${list(t.hobbies.map(lcFirst))}.`)}set('interests',parts,bits)}

  // Criteria, both directions
  const crit=[];
  for(const[k,c]of Object.entries(vCrit||{})){const d=CRITD[k];if(!d||!c.level)continue;const e=evalCrit(d,c.value,t);crit.push({dir:'yours',key:k,cat:d.cat,level:c.level,...e,want:crValueText(d,c.value),label:d.label})}

  const SV={met:1,partial:.5,unmet:0};
  const catScore={};
  for(const k of Object.keys(WEIGHTS)){const parts=[];let wsum=0,acc=0;
    if(cats[k]&&cats[k].sim!=null){acc+=cats[k].sim*2;wsum+=2}
    crit.filter(c=>c.cat===k&&c.status in SV).forEach(c=>{const w=LEVELS[c.level].w;acc+=SV[c.status]*w;wsum+=w});
    catScore[k]=wsum?acc/wsum:null}
  let ws=0,tot=0;for(const[k,w]of Object.entries(WEIGHTS))if(catScore[k]!=null){tot+=catScore[k]*w;ws+=w}
  crit.filter(c=>c.cat==='other'&&c.status in SV).forEach(c=>{const w=LEVELS[c.level].w*.03;tot+=SV[c.status]*w;ws+=w});
  let score=ws?tot/ws:0;
  const essentialsUnmet=crit.filter(c=>c.dir==='yours'&&c.level==='essential'&&c.status==='unmet').length;
  score-=essentialsUnmet*.08;

  // Sections
  const strong=[],diff=[],discuss=[];
  const lvl=c=>LEVELS[c.level].label;
  const critItem=c=>({cat:CATLABEL[c.cat],title:c.dir==='yours'?`${c.label} · ${lvl(c)} for you`:`${c.label} · ${lvl(c)} for ${T}`,
    text:c.dir==='yours'?`Your criteria: ${c.want}. ${c.detail}`:`${T}’s criteria: ${c.want}. ${c.detail}`});
  for(const k of Object.keys(WEIGHTS)){const c=cats[k],s=catScore[k];if(!c||!c.text)continue;
    const item={cat:CATLABEL[k],title:CATLABEL[k],text:c.text};
    if(s==null)continue;if(s>=.72)strong.push(item);else if(s<.42)diff.push(item);else discuss.push(item)}
  const order={essential:0,strong:1,preference:2,flexible:3};
  crit.sort((a,b)=>order[a.level]-order[b.level]);
  crit.forEach(c=>{if(c.status==='met'&&(c.level==='essential'||c.level==='strong'))strong.push(critItem(c));
    else if(c.status==='unmet'&&c.level!=='flexible')diff.push(critItem(c));
    else if(c.status==='unmet'||c.status==='partial'||(c.status==='unknown'&&c.level!=='flexible'))discuss.push(critItem(c))});
  // Life topics worth discussing
  if(t.everMarried&&t.everMarried!==EVER[0])discuss.push({cat:'Life circumstances',title:'Marital history',text:`${T} has shared that ${P.sub} was ${lcFirst(t.everMarried.replace('Previously married — ','previously married ('))+')'}. It may help to understand each other’s story at a pace that feels respectful.`});
  if(v.locality&&t.locality&&v.locality.trim().toLowerCase()!==t.locality.trim().toLowerCase())discuss.push({cat:CATLABEL.faith,title:'Serving after marriage',text:`You meet in different localities (${v.locality} and ${t.locality}). How each of you pictures serving after marriage could be a good conversation.`});
  if(t.healthSummary&&t.healthSummary!==HEALTH[0])discuss.push({cat:'Health',title:'Health',text:`${T} has noted: “${lcFirst(t.healthSummary)}.” It may be something to talk about when the time is right.`});
  if(!('visa' in t)&&!('citizenship' in t))discuss.push({cat:'Life circumstances',title:'Practical circumstances',text:'Citizenship and visa details are kept private. If an introduction moves forward, these are best discussed directly.'});

/* ============================== Access-controlled API ============================== */
class ApiError extends Error{constructor(m,code){super(m);this.code=code||'error'}}
const API=(()=>{
  const D=()=>Store.get();
  const wait=(ms=110)=>new Promise(r=>setTimeout(r,ms+Math.random()*140));
  const seq=p=>`${p}${++D().seq}`;
  const commit=()=>Store.commit();
  const userById=id=>D().users.find(u=>u.id===id);
  const isStaff=u=>u&&(u.role==='matchmaker'||u.role==='admin');
  const pairOf=(i,a,b)=>(i.a===a&&i.b===b)||(i.a===b&&i.b===a);
  const other=(i,uid)=>i.a===uid?i.b:i.a;
  function me(){const s=D().session;const u=s&&userById(s.uid);if(!u)throw new ApiError('Please sign in to continue.','auth');if(u.status==='suspended'){D().session=null;commit();throw new ApiError('This account is suspended. Contact the Consider team.','auth')}return u}
  function need(...roles){const u=me();if(!roles.includes(u.role))throw new ApiError('You don’t have permission to do that.','forbidden');return u}
  function relation(viewer,targetId){if(viewer.id===targetId)return'self';if(isStaff(viewer))return'staff';if(D().intros.some(i=>i.status==='connected'&&pairOf(i,viewer.id,targetId)))return'connected';return'member'}
  function notify(uid,text,link){D().notifs.push({id:seq('n'),uid,text,link:link||null,at:now(),read:false})}
  function notifyStaff(text,link){D().users.filter(u=>u.role==='matchmaker'&&u.status==='active').forEach(u=>notify(u.id,text,link))}
  const nm=uid=>{const p=D().profiles[uid];return p?p.firstName:'A former member'};

  // The one place that decides which fields leave the store for a given relationship.
  function project(uid,rel){
    const p=D().profiles[uid],u=userById(uid);if(!p||!u)return null;
    const lvl=k=>(p.vis&&p.vis[k])||FIELD[k].vis;
    const ok=k=>ALLOW[lvl(k)].includes(rel);
    const out={id:uid,firstName:p.firstName,gender:p.gender,ageBand:ageBand(ageOf(p))};
    for(const f of FIELDS){
      if(f.key==='firstName'||f.key==='gender')continue;
      if(!ok(f.key)){if(f.key==='photo'&&p.photo)out.photoWithheld=true;continue}
      if(f.type==='monthyear'){if(p.birthYear){out.birthMonth=p.birthMonth;out.birthYear=p.birthYear;out.age=ageOf(p)}}
      else if(f.key==='email')out.email=u.email;
      else if(p[f.key]!==undefined&&p[f.key]!==''&&p[f.key]!==null)out[f.key]=clone(p[f.key]);
    }
    if(rel==='self'||rel==='staff'){out.status=p.status;out.hidden=!!p.hidden;out.reviewNote=p.reviewNote||'';out.vis=Object.fromEntries(FIELDS.map(f=>[f.key,lvl(f.key)]));out.updatedAt=p.updatedAt;out.step=p.step||0}
    const c=D().criteria[uid];
    if(c&&(c.share||rel==='self'||rel==='staff'))out.criteria={items:clone(c.items),note:c.note||'',share:!!c.share};
    return out;
  }
  function eligibleFor(viewer,targetId){
    const tu=userById(targetId),tp=D().profiles[targetId],vp=D().profiles[viewer.id];
    if(!tu||!tp||!vp||tu.id===viewer.id)return false;
    if(tu.role!=='user'||tu.status!=='active'||tp.status!=='approved'||tp.hidden)return false;
    if(tp.gender===vp.gender)return false;
    if(D().blocks.some(b=>(b.by===viewer.id&&b.target===targetId)||(b.by===targetId&&b.target===viewer.id)))return false;
    return true;
  }
  function busyConnected(uid){return D().settings.oneConnection&&D().intros.some(i=>i.status==='connected'&&(i.a===uid||i.b===uid))}
  function compatFor(vUid,tUid){
    const viewer=userById(vUid),target=userById(tUid);
    const t=project(tUid,relation(viewer,tUid)),v=project(vUid,'self');
    const vSeen=project(vUid,relation(target,vUid));
    const tCrit=t.criteria&&t.criteria.share?t.criteria.items:null;
    return compatCore(v,t,(D().criteria[vUid]||{}).items||{},tCrit,vSeen);
  }
  function sanitizeProfile(patch){
    const out={};
    for(const f of FIELDS){
      if(f.type==='email')continue;
      if(f.type==='monthyear'){if('birthMonth'in patch)out.birthMonth=patch.birthMonth?Math.min(12,Math.max(1,parseInt(patch.birthMonth))):null;if('birthYear'in patch)out.birthYear=patch.birthYear?parseInt(patch.birthYear):null;continue}
      if(!(f.key in patch))continue;let v=patch[f.key];
      if(f.key==='photo'){out.photo=typeof v==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(v)&&v.length<700000?v:'';continue}
      if(f.type==='chips')v=Array.isArray(v)?v.filter(x=>f.options.includes(x)):[];
      else if(f.type==='number'||f.type==='scale')v=v===''||v==null||isNaN(Number(v))?null:Number(v);
      else v=String(v??'').trim().slice(0,f.max||200);
      out[f.key]=v;
    }
    return out;
  }
  function closeIntro(i,by,text){i.status='closed';i.updatedAt=now();i.history.push({at:now(),status:'closed',by,text:text||'',pub:true})}
  const ep=fn=>async(...a)=>{await wait();try{return clone(await fn(...a))}finally{commit()}};

  return{
    /* ---------- auth ---------- */
    session:ep(()=>{const s=D().session;const u=s&&userById(s.uid);if(!u||u.status!=='active')return null;const p=D().profiles[u.id];return{id:u.id,email:u.email,role:u.role,firstName:p?p.firstName:u.name,profileStatus:p?p.status:null,step:p?p.step||0:0}}),
    register:ep(async({firstName,email,password,gender,agree})=>{
      const e={};firstName=String(firstName||'').trim();email=String(email||'').trim().toLowerCase();
      if(!firstName)e.firstName='Enter your first name.';
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))e.email='Enter a valid email address.';else if(D().users.some(u=>u.email===email))e.email='An account with this email already exists. Try signing in.';
      if(String(password||'').length<8)e.password='Use at least 8 characters.';
      if(!['Brother','Sister'].includes(gender))e.gender='Choose one.';
      if(!agree)e.agree='Please confirm to continue.';
      if(Object.keys(e).length){const err=new ApiError('Check the highlighted fields.','validation');err.fields=e;throw err}
      const id=seq('u'),s=salt();
      D().users.push({id,email,role:'user',status:'active',salt:s,hash:await hashPw(password,s),createdAt:now()});
      D().profiles[id]={firstName,gender,status:'draft',vis:{},hidden:false,step:0,createdAt:now(),updatedAt:now()};
      D().criteria[id]={items:{},note:'',share:true};
      D().session={uid:id};
      notify(id,'Welcome to Consider. Finish your profile and criteria, then submit it for review.');
      return{id};
    }),
    login:ep(async(email,password)=>{
      email=String(email||'').trim().toLowerCase();const u=D().users.find(x=>x.email===email);
      if(!u||u.hash!==await hashPw(String(password||''),u.salt))throw new ApiError('That email and password don’t match an account.','auth');
      if(u.status!=='active')throw new ApiError('This account is suspended. Contact the Consider team.','auth');
      D().session={uid:u.id};return{id:u.id,role:u.role};
    }),
    logout:ep(()=>{D().session=null;return true}),
    settings:ep(()=>{me();const s=D().settings;return{requireApproval:s.requireApproval,autoConnect:s.autoConnect,aiEnabled:s.aiEnabled,oneConnection:s.oneConnection,persistent:Store.isPersistent()}}),

    /* ---------- own profile ---------- */
    myProfile:ep(()=>{const u=need('user');return project(u.id,'self')}),
    saveMyProfile:ep((patch,vis,step)=>{
      const u=need('user'),p=D().profiles[u.id];const clean=sanitizeProfile(patch||{});
      if(clean.gender&&p.status!=='draft'&&clean.gender!==p.gender)delete clean.gender;
      const stepFields=FIELDS.filter(f=>Object.keys(clean).includes(f.key)||(f.type==='monthyear'&&'birthYear'in clean));
      const errs=validateFields(stepFields,{...p,...clean});
      if(Object.keys(errs).length){const e=new ApiError('Some answers need attention.','validation');e.fields=errs;throw e}
      Object.assign(p,clean);
      for(const[k,l]of Object.entries(vis||{}))if(FIELD[k]&&FIELD[k].opts.includes(l))(p.vis=p.vis||{})[k]=l;
      if(isNum(step))p.step=Math.max(p.step||0,step);
      p.updatedAt=now();if(p.status==='approved')p.editedSinceReview=true;
      return project(u.id,'self');
    }),
    submitMyProfile:ep(()=>{
      const u=need('user'),p=D().profiles[u.id];

    /* ---------- criteria ---------- */

    saveMyCriteria:ep((items,note,share)=>{

    }),

    /* ---------- discovery ---------- */
    discover:ep((filters={})=>{
      const u=need('user');const vp=D().profiles[u.id];
      if(vp.status==='draft')return{state:'draft',cards:[]};
      const passed=new Set(D().interests.filter(x=>x.from===u.id&&x.kind==='pass').map(x=>x.to));
      const mine=new Set(D().interests.filter(x=>x.from===u.id&&x.kind==='interest').map(x=>x.to));
      const inIntro=new Set(D().intros.filter(i=>i.a===u.id||i.b===u.id).map(i=>other(i,u.id)));
      let cards=D().users.filter(t=>eligibleFor(u,t.id)&&!passed.has(t.id)&&!inIntro.has(t.id)&&!busyConnected(t.id)).map(t=>{
        const p=project(t.id,relation(u,t.id)),c=compatFor(u.id,t.id);
        const ess=p.criteria?Object.entries(p.criteria.items).filter(([,x])=>x.level==='essential').map(([k,x])=>({label:CRITD[k].label,value:crValueText(CRITD[k],x.value)})):[];

      const total=cards.length;

    if(t.locality)out.push(`What’s something you appreciate about the saints in the ${t.locality}?`);
    if(t.job)out.push(`What do you enjoy most about your work as ${/^[aeiou]/i.test(t.job)?'an':'a'} ${lcFirst(t.job)}?`);
    if(t.hobbies&&t.hobbies.length&&!sh.length)out.push(`Your profile mentions ${lcFirst(t.hobbies[0])}. What drew you to it?`);
    out.push('Thank you for being open to this introduction. What would make a first conversation comfortable for you?');
    return out.slice(0,4).map(x=>'- '+x).join('\n')}
  if(kind==='explain'){if(!c)return`This is ${T}’s profile as members see it.`;const s=[];
    if(c.sections.strong.length)s.push(`You align most clearly in ${list([...new Set(c.sections.strong.map(x=>x.cat))].slice(0,3).map(lcFirst))}.`);
    if(c.sections.diff.length)s.push(`The profiles differ in ${list([...new Set(c.sections.diff.map(x=>x.cat))].slice(0,3).map(lcFirst))}, which may or may not matter to either of you.`);
    if(c.sections.discuss.length)s.push(`Areas such as ${list([...new Set(c.sections.discuss.map(x=>x.cat))].slice(0,3).map(lcFirst))} are open questions best explored in conversation.`);
    s.push('These notes come only from what each of you shared. They describe; they don’t decide.');return s.join(' ')}
  return'';
}
async function runAI(kind,targetId){
  const ctx=await API.aiContext(targetId);
  const sample=await getSample();
  if(sample){try{const r=await sample(aiPrompt(kind,ctx),{modelTier:'quick'});const text=(r&&r.text||'').trim();if(text&&!FORBIDDEN.test(text))return{text,source:'ai'}}catch(e){if(e&&(e.code==='not_granted'||e.code==='unavailable'))sampleBroken=true}}
  return{text:aiFallback(kind,ctx),source:'guide'};
}

  const lvl=(p.vis&&p.vis[f.key])||f.vis;const id='f-'+f.key;const v=p[f.key];let ctrl='';
  switch(f.type){
    case'text':case'tel':ctrl=`<input id="${id}" name="${f.key}" type="${f.type==='tel'?'tel':'text'}" value="${esc(v??'')}" maxlength="${f.max||120}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.key==='firstName'?'autocomplete="given-name"':f.key==='lastName'?'autocomplete="family-name"':f.type==='tel'?'autocomplete="tel"':''}>`;break;
    case'email':ctrl=`<input id="${id}" type="email" value="${esc(S.user.email)}" disabled>`;break;
    case'number':ctrl=`<input id="${id}" name="${f.key}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" value="${esc(v??'')}">`;break;
    case'select':ctrl=`<select id="${id}" name="${f.key}" ${f.key==='gender'&&p.status!=='draft'?'disabled':''}><option value="">Choose…</option>${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case'textarea':ctrl=`<textarea id="${id}" name="${f.key}" maxlength="${f.max||600}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${esc(v??'')}</textarea>`;break;
    case'chips':ctrl=`<div class="chips" id="${id}" role="group" aria-label="${esc(f.label)}">${f.options.map(o=>`<label class="chip"><input type="checkbox" name="${f.key}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;break;
    case'scale':ctrl=`<div class="scale" id="${id}" role="radiogroup" aria-label="${esc(f.label)}">${f.options.map((o,i)=>`<label class="chip"><input type="radio" name="${f.key}" value="${i+1}" ${v===i+1?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;break;
    case'monthyear':{const yNow=new Date().getFullYear();ctrl=`<div class="grid2"><select id="${id}" name="birthMonth" aria-label="Birth month"><option value="">Month…</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${p.birthMonth===i+1?'selected':''}>${m}</option>`).join('')}</select><select name="birthYear" aria-label="Birth year"><option value="">Year…</option>${Array.from({length:70},(_,i)=>yNow-18-i).map(y=>`<option ${p.birthYear===y?'selected':''}>${y}</option>`).join('')}</select></div>`;break}
    case'photo':{const ph=S.wiz.photo;ctrl=`<div class="photo-field"><img src="${ph||monogram(p.firstName,S.user.id)}" alt="${ph?'Your photo':''}" id="photo-prev"><div class="stack" style="gap:8px"><label class="btn ghost sm" for="photo-in">${ph?'Replace photo':'Upload photo'}</label><input type="file" id="photo-in" accept="image/*" hidden>${ph?'<button type="button" class="btn quiet sm" data-act="photo-remove">Remove photo</button>':''}<p class="help" data-photo-msg></p></div></div><input type="hidden" name="photo" id="photo-val" value="">`;break}
  }
  const visCtl=f.opts.length>1?`<label class="vis"><span>Visible to</span><select data-vis="${f.key}" aria-label="Who can see ${esc(f.label)}">${f.opts.map(l=>`<option value="${l}" ${l===lvl?'selected':''}>${VISLABEL[l]}</option>`).join('')}</select></label>`:`<span class="vis fixed">${lvl==='private'?LOCK+' ':''}${VISLABEL[lvl]}</span>`;
  return`<div class="field ${err?'has-err':''}" data-field="${f.key}"><div class="field-head"><label for="${id}">${esc(f.label)}${f.req?'':' <span class="opt">· optional</span>'}</label>${visCtl}</div>${f.help?`<p class="help">${esc(f.help)}</p>`:''}${ctrl}${err?`<p class="err">${esc(err)}</p>`:''}</div>`;
}
function readWizard(form){
  const fd=new FormData(form),step=STEPS[+form.dataset.step].id,patch={};
  for(const f of FIELDS.filter(x=>x.step===step)){
    if(f.type==='email')continue;
    if(f.type==='chips')patch[f.key]=fd.getAll(f.key);
    else if(f.type==='monthyear'){patch.birthMonth=Number(fd.get('birthMonth'))||null;patch.birthYear=Number(fd.get('birthYear'))||null}
    else if(f.type==='number'||f.type==='scale'){const x=fd.get(f.key);patch[f.key]=x===''||x==null?null:Number(x)}
    else if(f.type==='photo')patch.photo=S.wiz.photo||'';
    else if(f.key==='gender'&&form.querySelector('[name=gender]').disabled)continue;
    else patch[f.key]=String(fd.get(f.key)||'').trim();
  }
  const vis={};form.querySelectorAll('[data-vis]').forEach(s=>vis[s.dataset.vis]=s.value);
  return{patch,vis,fields:FIELDS.filter(x=>x.step===step)};
}
function criteriaForm(c,errs){
  const items=c.items||{};
  const row=d=>{const it=items[d.key]||{},on=!!it.level,v=it.value,n=`cv-${d.key}`;let ed='';
    if(d.type==='set')ed=`<div class="chips ${d.options.length>8?'dense':''}">${d.options.map(o=>`<label class="chip"><input type="checkbox" name="${n}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
    else if(d.type==='states')ed=`<div class="states-box"><div class="chips dense">${STATES.map(o=>`<label class="chip"><input type="checkbox" name="${n}" value="${o}" ${(v||[]).includes(o)?'checked':''}><span>${o}</span></label>`).join('')}</div></div>`;
    else if(d.type==='range')ed=`<div class="grid2"><input type="number" name="${n}-0" aria-label="Minimum" placeholder="From" min="${d.min}" max="${d.max}" value="${v?v[0]:''}"><input type="number" name="${n}-1" aria-label="Maximum" placeholder="To" min="${d.min}" max="${d.max}" value="${v?v[1]:''}"></div><p class="help">${d.unit==='cm'?'Centimeters':'Years'}</p>`;
    else if(d.type==='number')ed=`<input type="number" name="${n}" min="${d.min}" max="${d.max}" value="${v??''}" style="max-width:160px">`;
    else if(d.type==='select')ed=`<select name="${n}" style="max-width:320px"><option value="">Choose…</option>${d.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(d.type==='text')ed=`<input type="text" name="${n}" value="${esc(v||'')}" placeholder="${esc(d.ph||'')}">`;
    else ed=`<p class="help">Applies when they list at least one area of service.</p>`;
    return`<div class="crit ${on?'':'off'} ${errs[d.key]?'has-err':''}" data-crit="${d.key}"><div class="crit-head"><strong>${esc(d.label)}</strong><select name="lvl-${d.key}" aria-label="Importance of ${esc(d.label)}"><option value="">Not considering</option>${Object.entries(LEVELS).map(([k,l])=>`<option value="${k}" ${it.level===k?'selected':''}>${l.label}</option>`).join('')}</select></div><div class="crit-body">${ed}</div>${errs[d.key]?`<p class="err">${esc(errs[d.key])}</p>`:''}</div>`};
  const groups=['faith','family','character','personality','lifestyle','location','other'];
  return`<form data-form="criteria" novalidate>
   <div class="lvl-legend"><div><b>Essential</b>Profiles that don’t meet it are flagged.</div><div><b>Strong preference</b>Weighs heavily.</div><div><b>Preference</b>Counts, gently.</div><div><b>Flexible</b>Noted, rarely decisive.</div></div>
   ${groups.map(g=>`<h2 class="group-h" style="margin-top:22px">${esc(CATLABEL[g])}${WEIGHTS[g]?` <span class="small muted" style="font-family:var(--body)">· ${Math.round(WEIGHTS[g]*100)}% of ordering</span>`:''}</h2>${CRIT.filter(d=>d.cat===g).map(row).join('')}`).join('')}
   <div class="field" style="margin-top:20px"><label for="c-note">Anything else about what you’re looking for</label><textarea id="c-note" name="note" maxlength="600">${esc(c.note||'')}</textarea></div>
   <label class="switch small" style="margin-top:14px"><input type="checkbox" name="share" ${c.share!==false?'checked':''}><span>Show my criteria to members. When off, your criteria still guide your own discovery but others won’t see them.</span></label>
   ${errs._crit?`<p class="err" style="margin-top:10px">${esc(errs._crit)}</p>`:''}
   ${wizFoot(5,{})}</form>`;
}
function readCriteria(form){const fd=new FormData(form),items={};
  for(const d of CRIT){const level=fd.get('lvl-'+d.key);if(!level)continue;const n='cv-'+d.key;let value;
    if(d.type==='set'||d.type==='states')value=fd.getAll(n);else if(d.type==='range')value=[fd.get(n+'-0'),fd.get(n+'-1')].map(x=>x===''?NaN:Number(x));else if(d.type==='number')value=fd.get(n)===''?NaN:Number(fd.get(n));else if(d.type==='bool')value=true;else value=fd.get(n);
    items[d.key]={level,value}}
  return{items,note:fd.get('note'),share:!!fd.get('share')}}
async function reviewStep(p,crit){
  const errs=validateFields(FIELDS,p);const missing=STEPS.filter(s=>FIELDS.some(f=>f.step===s.id&&errs[f.key==='birth'?'birth':f.key]));
  const hasCrit=Object.values(crit.items||{}).some(x=>x.level);
  const done=p.status==='submitted'||p.status==='approved';
  return`<div class="stack">
   ${missing.length?`<div class="banner warn"><div><strong>A few answers are missing</strong>Complete: ${missing.map(s=>`<button class="linkbtn" data-act="wiz-jump" data-step="${STEPS.indexOf(s)}">${esc(s.title)}</button>`).join(', ')}.</div></div>`:''}
   ${!hasCrit?`<div class="banner warn"><div><strong>No marriage criteria yet</strong><button class="linkbtn" data-act="wiz-jump" data-step="5">Add at least one</button> so discovery reflects what matters to you.</div></div>`:''}
   <div class="card stack"><div class="spread"><h3>Your profile</h3>${pstatusPill(p.status)}</div>
    <p class="small muted">See exactly what a member, a connection or a matchmaker can see before you submit.</p>
    <div class="row"><button class="btn ghost sm" data-go="preview" data-p='{"mode":"member"}'>View as a member</button><button class="btn ghost sm" data-go="preview" data-p='{"mode":"connected"}'>View as a connection</button><button class="btn ghost sm" data-go="preview" data-p='{"mode":"staff"}'>View as a matchmaker</button></div></div>
   <div class="card stack"><h3>Before you submit</h3><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>A matchmaker reviews each profile before it appears in discovery.</li><li>No one learns that you expressed interest unless they express interest in you too.</li><li>Private details stay private: only you and the matchmaking team can see them.</li><li>You can edit, hide or delete your profile at any time.</li></ul></div>
   <div class="wiz-foot"><button class="btn ghost" data-act="wiz-back" data-step="6">Back</button>${done?`<button class="btn" data-go="me">Done</button>`:`<button class="btn" data-act="submit-profile" ${missing.length||!hasCrit?'disabled':''}>${p.status==='changes'?'Resubmit for review':'Submit for review'}</button>`}</div></div>`;
}
AFTER.setup=()=>{
  const inp=$('#photo-in');if(inp)inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const msg=document.querySelector('[data-photo-msg]');msg.textContent='Preparing photo…';
    try{S.wiz.photo=await resizeImage(f);$('#photo-prev').src=S.wiz.photo;msg.textContent='Photo ready. It’s saved when you continue.'}catch(e){msg.textContent=e.message;msg.className='err'}};
  document.querySelectorAll('[data-crit] select[name^="lvl-"]').forEach(s=>s.onchange=()=>s.closest('.crit').classList.toggle('off',!s.value));
  const firstErr=document.querySelector('.has-err');if(firstErr)firstErr.scrollIntoView({block:'center'});
};
function resizeImage(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type))return rej(new Error('Choose an image file such as JPG or PNG.'));if(file.size>15e6)return rej(new Error('That image is over 15 MB. Choose a smaller one.'));
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,520/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=()=>rej(new Error('That image couldn’t be read. Try a JPG or PNG.'));img.src=r.result};r.onerror=()=>rej(new Error('The file couldn’t be read.'));r.readAsDataURL(file)})}

/* ---------- Discover ---------- */
VIEWS.discover=async()=>{
  const r=await API.discover(S.filters);
  if(r.state==='draft')return`<div class="page-head"><h1>Discover</h1></div><div class="empty"><h3>Finish your profile first</h3><p>Discovery opens once your profile and marriage criteria are complete. It takes about ten minutes.</p><button class="btn" data-go="setup" data-p='{"step":0}'>Continue your profile</button></div>`;
  const banner=r.state==='submitted'?`<div class="banner"><div><strong>Your profile is under review</strong>You can browse now. Expressing interest opens once a matchmaker approves your profile, and until then others won’t see you.</div></div>`:r.state==='changes'?`<div class="banner warn"><div><strong>Changes requested</strong>A matchmaker left a note on your profile. <button class="linkbtn" data-go="setup" data-p='{"step":6}'>Review it</button></div></div>`:'';
  const states=[...new Set(r.cards.map(c=>c.profile.state).filter(Boolean))];
  return`<div class="page-head"><h1>Discover</h1><p>People whose church life and criteria most align with yours appear first. There’s no score and no rush.</p></div>${banner}
   <div class="filters" role="group" aria-label="Filters">
    <select id="flt-state" data-change="filter" data-k="state" aria-label="State"><option value="">Any state</option>${[...new Set([...states,S.filters.state].filter(Boolean))].sort().map(s=>`<option ${S.filters.state===s?'selected':''}>${s}</option>`).join('')}</select>
    <select id="flt-age" data-change="filter" data-k="age" aria-label="Age"><option value="">Any age</option>${[['20','20s'],['30','30s'],['40','40s and up']].map(([v,l])=>`<option value="${v}" ${S.filters.age===v?'selected':''}>${l}</option>`).join('')}</select>
    <label class="switch"><input type="checkbox" id="flt-ess" data-change="filter" data-k="essentials" ${S.filters.essentials?'checked':''}><span>Meets my essentials</span></label>
   </div>
   ${r.cards.length?`<div class="cards">${r.cards.map(c=>profileCard(c,{canInterest:r.state==='approved'})).join('')}</div>`
   :`<div class="empty"><h3>${r.total?'No one matches these filters':'You’ve seen everyone for now'}</h3><p>${r.total?'Try widening the filters.':'New profiles are reviewed and added regularly. Check back soon, or review people you passed on.'}</p><div class="row" style="justify-content:center">${r.total?'<button class="btn ghost" data-act="clear-filters">Clear filters</button>':''}${r.passedCount?'<button class="btn ghost" data-go="me" data-p=\'{"focus":"passes"}\'>See passed profiles</button>':''}</div></div>`}`;
};

     <div class="row" style="justify-content:space-between"><button class="btn quiet sm" data-go="person" data-p='${JSON.stringify({id:o.id})}'>View profile</button>${i.status!=='closed'?`<button class="btn quiet sm" data-act="end-intro" data-id="${i.id}" data-name="${esc(o.firstName)}">${i.status==='connected'?'End connection':'Close introduction'}</button>`:''}</div></article>`};
  return`<div class="page-head"><h1>Connections</h1><p>Introductions move from mutual interest, through a matchmaker’s review, to a private conversation when you’re both ready.</p></div>

    ${r.pending.length?r.pending.map(x=>`<div class="mini"><img src="${photoOf(x.profile)}" alt=""><div><b>${esc(x.profile.firstName)}</b><p class="small muted">${esc(where(x.profile))} · ${ago(x.at)}</p></div><div class="row"><button class="btn quiet sm" data-go="person" data-p='${JSON.stringify({id:x.id})}'>View</button><button class="btn quiet sm" data-act="withdraw" data-id="${x.id}">Withdraw</button></div></div>`).join(''):'<p class="small muted">None at the moment.</p>'}</section>

   ${p.status==='draft'?`<div class="banner"><div><strong>${total-missing>0?`${Math.round((total-missing)/total*100)}% of required answers complete`:'Let’s get started'}</strong><div style="margin-top:8px"><button class="btn sm" data-go="setup" data-p='${JSON.stringify({step:Math.min(p.step||0,6)})}'>Continue your profile</button></div></div></div>`:''}
   <div class="stack">

    <section class="section"><h2>Privacy</h2>
     <label class="switch"><input type="checkbox" id="hide-toggle" data-change="hidden" ${p.hidden?'checked':''}><span><b>Hide my profile from discovery</b><br><span class="small muted">Existing introductions and conversations continue. New people won’t see you.</span></span></label>

    <div class="seg" role="group" aria-label="Preview as" style="max-width:520px">${[['member','Member'],['connected','Connection'],['staff','Matchmaker']].map(([m,l])=>`<button data-go="preview" data-p='{"mode":"${m}"}' aria-pressed="${m===mode}">${l}</button>`).join('')}</div></div>

VIEWS.mm=async({tab='intros'}={})=>{
  const[o,queue,board,members]=await Promise.all([API.staffOverview(),API.reviewQueue(),API.introBoard(),API.members()]);
  const active=o.intros.pending+o.intros.reviewing+o.intros.proposed+o.intros.accepted;
  const stats=`<div class="stats"><div class="stat"><b>${o.reviews}</b><span>Profiles awaiting review</span></div><div class="stat"><b>${o.intros.pending+o.intros.accepted}</b><span>Introductions needing action</span></div><div class="stat"><b>${active}</b><span>Introductions in progress</span></div><div class="stat"><b>${o.intros.connected}</b><span>Connected pairs</span></div></div>`;
  const tabs=`<div class="tabs" role="tablist">${[['intros','Introductions'],['reviews',`Profile reviews (${queue.length})`],['members','Members']].map(([k,l])=>`<button role="tab" data-go="mm" data-p='{"tab":"${k}"}' aria-selected="${tab===k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(tab==='reviews')body=queue.length?`<div class="stack" style="gap:0">${queue.map(q=>`<div class="mini"><img src="${q.photo||monogram(q.firstName,q.id)}" alt=""><div><b>${esc(q.firstName)} ${esc(q.lastName||'')}</b><p class="small muted">${esc([q.gender,where(q)].filter(Boolean).join(' · '))} · submitted ${ago(q.submittedAt)}</p></div><div class="row">${pstatusPill(q.status)}<button class="btn sm" data-go="mmReview" data-p='${JSON.stringify({uid:q.id})}'>Review</button></div></div>`).join('')}</div>`:`<div class="empty"><h3>All caught up</h3><p>New profile submissions will appear here.</p></div>`;
  if(tab==='intros'){const col=(title,sts)=>{const its=board.filter(i=>sts.includes(i.status));return`<div class="col"><h3><span>${title}</span><span class="muted">${its.length}</span></h3>${its.length?its.map(i=>`<button class="icard" data-go="mmIntro" data-p='${JSON.stringify({id:i.id})}'><div class="spread"><strong>${esc(i.a.firstName)} & ${esc(i.b.firstName)}</strong>${introPill(i.status)}</div><span class="xs muted">${i.status==='proposed'?`${Object.values(i.accepted).filter(Boolean).length} of 2 accepted · `:i.status==='connected'?esc(i.stage)+' · ':''}Updated ${ago(i.updatedAt)}</span></button>`).join(''):'<p class="xs muted">None</p>'}</div>`};
    body=`<div class="board">${col('Needs your action',['pending','reviewing','accepted'])}${col('Waiting on members',['proposed'])}${col('Connected',['connected'])}</div>${board.some(i=>i.status==='closed')?`<section class="section" style="margin-top:20px"><h3>Closed</h3>${board.filter(i=>i.status==='closed').map(i=>`<button class="icard" style="margin-top:8px" data-go="mmIntro" data-p='${JSON.stringify({id:i.id})}'><strong>${esc(i.a.firstName)} & ${esc(i.b.firstName)}</strong><span class="xs muted">Closed ${ago(i.updatedAt)}</span></button>`).join('')}</section>`:''}`}
  if(tab==='members')body=`<div class="table-wrap"><table><thead><tr><th>Member</th><th>Locality</th><th>Location</th><th>Profile</th><th></th></tr></thead><tbody>${members.map(m=>`<tr><td><b>${esc(m.firstName||'—')} ${esc(m.lastName||'')}</b><br><span class="xs muted">${esc(m.gender||'')}</span></td><td>${esc(m.locality||'—')}</td><td>${esc(where(m)||'—')}</td><td>${m.status?pstatusPill(m.status):'—'}${m.hidden?' <span class="pill">Hidden</span>':''}</td><td><button class="btn quiet sm" data-go="mmReview" data-p='${JSON.stringify({uid:m.id})}'>Open</button></td></tr>`).join('')}</tbody></table></div>`;
  return`<div class="page-head"><div class="spread"><h1>Matchmaking</h1><button class="btn quiet sm" data-act="logout">Sign out</button></div><p>Review profiles, shepherd introductions, and keep private notes. Members never see your notes or their conversations’ contents.</p></div>${stats}${tabs}${body}`;
};
function notesHTML(subject,notes){return`<section class="section"><div class="spread"><h2>Private notes</h2><span class="lock">${LOCK} Staff only</span></div>${notes.length?`<ul class="hist">${notes.map(n=>`<li><span class="xs muted">${ago(n.at)}<br>${esc(n.author)}</span><span>${esc(n.text)}</span></li>`).join('')}</ul>`:'<p class="small muted">No notes yet.</p>'}
  <form class="stack" data-form="note" data-subject="${subject}"><textarea id="note-${subject.replace(':','-')}" name="text" placeholder="Add a note for the matchmaking team…" maxlength="1500" aria-label="New note"></textarea><div><button class="btn ghost sm" type="submit">Add note</button></div></form></section>`}

VIEWS.mmIntro=async({id})=>{

  const nameA=a?a.firstName:'Former member',nameB=b?b.firstName:'Former member';

  return`<button class="btn quiet" data-go="mm" data-p='{"tab":"intros"}' style="margin-left:-10px">← Matchmaking</button>
   <div class="page-head" style="margin-top:8px"><div class="row"><h1>${esc(nameA)} & ${esc(nameB)}</h1>${introPill(i.status)}</div>${stepsBar(i.status)}</div>
   <div class="row" style="margin-bottom:20px">${actions.map(([to,l])=>`<button class="btn" data-act="mm-advance" data-id="${id}" data-to="${to}" data-names="${esc(nameA+' and '+nameB)}">${l}</button>`).join('')}${i.status!=='closed'?`<button class="btn ghost" data-act="mm-advance" data-id="${id}" data-to="closed" data-names="${esc(nameA+' and '+nameB)}">Close introduction</button>`:''}</div>
   ${i.status==='proposed'?'<div class="banner"><div><strong>Waiting on both members</strong>Each member accepts or declines on their own Connections page.</div></div>':''}
   ${i.proposalNote?`<div class="note" style="margin-bottom:16px"><span class="label">Introduction note shared with both</span>${esc(i.proposalNote)}</div>`:''}
   <div class="two">${side(a)}${side(b)}</div>
   ${r.compat?compatHTML(r.compat,nameB).replace('How you and','How '+esc(nameA)+' and').replace('Drawn only from what each of you chose to share.','Seen from '+esc(nameA)+'’s criteria and profile.'):''}
   <section class="section"><h2>History</h2><ul class="hist">${i.history.map(h=>`<li><span class="xs muted">${clock(h.at)}</span><span><b>${STATUS_LABEL[h.status]}</b>${h.text?` · ${esc(h.text)}`:''}${h.byName&&h.by!=='system'?` <span class="muted">(${esc(h.byName)})</span>`:''}</span></li>`).join('')}</ul>
    ${i.status==='connected'||i.messageCount?`<p class="small muted">Relationship stage: <b>${esc(i.progress.stage)}</b> · ${i.messageCount} messages exchanged. Message contents are private to the two members.</p>`:''}</section>
   ${notesHTML('intro:'+id,r.notes)}`;

VIEWS.admin=async({tab='users'}={})=>{
  const tabs=`<div class="tabs" role="tablist">${[['users','Users'],['reports','Reports'],['settings','Settings']].map(([k,l])=>`<button role="tab" data-go="admin" data-p='{"tab":"${k}"}' aria-selected="${tab===k}">${l}</button>`).join('')}</div>`;

  if(tab==='reports'){const r=await API.reports();body=r.length?`<div class="stack">${r.map(x=>`<div class="card stack" style="gap:10px"><div class="spread"><b>About ${esc(x.targetName)}</b><span class="pill ${x.status==='open'?'warn':''}">${x.status==='open'?'Open':x.status==='resolved'?'Resolved':'Dismissed'}</span></div><p>${esc(x.reason)}</p><p class="xs muted">Reported by ${esc(x.byName)} · ${ago(x.at)}${x.targetStatus==='suspended'?' · member suspended':''}</p>${x.status==='open'?`<div class="row"><button class="btn sm" data-act="report-resolve" data-id="${x.id}" data-to="resolved">Mark resolved</button><button class="btn ghost sm" data-act="report-resolve" data-id="${x.id}" data-to="dismissed">Dismiss</button>${x.targetStatus==='active'?`<button class="btn quiet sm" data-act="user-status" data-id="${x.target}" data-to="suspended" data-name="${esc(x.targetName)}" style="color:var(--bad)">Suspend member</button>`:''}</div>`:''}</div>`).join('')}</div>`:`<div class="empty"><h3>No reports</h3><p>Reports from members will appear here.</p></div>`}
  if(tab==='settings'){const s=await API.settings();const sw=(k,t,d)=>`<label class="switch" style="padding:14px 0;border-top:1px solid var(--line)"><input type="checkbox" data-change="setting" data-k="${k}" ${s[k]?'checked':''}><span><b>${t}</b><br><span class="small muted">${d}</span></span></label>`;
    body=`<div class="card" style="padding-top:6px">${sw('requireApproval','Require matchmaker approval','New and resubmitted profiles stay out of discovery until a matchmaker approves them.')}${sw('autoConnect','Connect on mutual interest','Skip the matchmaker workflow and open a conversation as soon as interest is mutual.')}${sw('oneConnection','One connection at a time','Members in an open connection are paused from others’ discovery.')}${sw('aiEnabled','AI conversation help','Summaries, discussion topics and conversation starters. Never judges character or advises on marriage.')}</div>
    <section class="section" style="margin-top:20px"><h2>Demo data</h2><p class="small muted">Restore the fictional members, introductions and messages. This signs everyone out of this browser.</p><div><button class="btn ghost" data-act="reset-demo">Reset demo data</button></div></section>
    ${s.persistent?'':'<div class="banner warn"><div><strong>Browser storage is unavailable</strong>Changes last only until this page is closed.</div></div>'}`}
  return`<div class="page-head"><div class="spread"><h1>Administration</h1><button class="btn quiet sm" data-act="logout">Sign out</button></div><p>Manage accounts, roles, reports and how the service behaves.</p></div>${tabs}${body}`;
};

const ACT={
  async demo(el){try{await API.login(el.dataset.email,'demo1234');await boot()}catch(e){fail(e)}},
