  'clear-filters'(){S.filters={essentials:false,state:'',age:''};go('discover')},
  'wiz-jump'(el){saveStepThen(+el.dataset.step)},
  'wiz-back'(el){saveStepThen(+el.dataset.step-1)},
  'wiz-exit'(el){saveStepThen(null)},
  'photo-remove'(){S.wiz.photo='';$('#photo-prev').src=monogram(S.wiz.data.firstName,S.user.id);document.querySelector('[data-act=photo-remove]').remove();document.querySelector('[data-photo-msg]').textContent='Photo will be removed when you continue.'},
  async 'submit-profile'(el){el.disabled=true;try{const r=await API.submitMyProfile();await refreshUser();toast(r.status==='approved'?'Your profile is live.':'Submitted. A matchmaker will review it.');go('discover')}catch(e){el.disabled=false;if(e.fields){S.wiz.errors=e.fields}fail(e)}},
  interest(el){const id=el.dataset.id,n=el.dataset.name;
    modal({title:`Express interest in ${n}?`,body:`<p>${esc(n)} won’t be told unless they also express interest in you. If they do, a matchmaker will review the introduction before any conversation begins.</p>`,confirm:'Express interest',
      onConfirm:async()=>{const r=await API.expressInterest(id);if(r.mutual){toast(r.status==='connected'?`You and ${n} are connected.`:`It’s mutual. A matchmaker will review your introduction with ${n}.`);go('connections')}else{toast(`Interest expressed. It stays private unless it’s mutual.`);refresh()}}})},
  async withdraw(el){try{await API.withdrawInterest(el.dataset.id);toast('Interest withdrawn.');refresh()}catch(e){fail(e)}},
  async pass(el){const id=el.dataset.id;try{await API.pass(id);toast(`You passed on ${el.dataset.name}.`,{action:'Undo',onAction:async()=>{await API.unpass(id);refresh()}});S.view==='person'?go('discover'):refresh()}catch(e){fail(e)}},
  async unpass(el){try{await API.unpass(el.dataset.id);toast('They’ll appear in discovery again.');refresh()}catch(e){fail(e)}},
  async ai(el){const out=$('#ai-out');out.hidden=false;out.innerHTML='<div class="skel" style="height:14px;width:90%"></div><div class="skel" style="height:14px;width:76%"></div><div class="skel" style="height:14px;width:60%"></div>';
    document.querySelectorAll('[data-act=ai]').forEach(b=>b.disabled=true);
    try{const r=await runAI(el.dataset.kind,el.dataset.id);const lines=r.text.split('\n').map(s=>s.trim()).filter(Boolean);const bullets=lines.filter(l=>/^[-•*]\s/.test(l));
      out.innerHTML=(bullets.length?`<ul>${bullets.map(l=>`<li>${esc(l.replace(/^[-•*]\s*/,''))}</li>`).join('')}</ul>`:lines.map(l=>`<p>${esc(l)}</p>`).join(''))+`<p class="ai-src">${r.source==='ai'?'Written with AI from what’s shared on both profiles.':'Generated from what’s shared on both profiles.'} It’s a starting point, not advice. Discernment is yours.</p>`}
    catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`}finally{document.querySelectorAll('[data-act=ai]').forEach(b=>b.disabled=false)}},
  'accept-intro'(el){modal({title:`Accept the introduction with ${el.dataset.name}?`,body:'<p>When you’ve both accepted, a matchmaker opens a private conversation for the two of you. You can close it at any time.</p>',confirm:'Accept',onConfirm:async()=>{const r=await API.respondProposal(el.dataset.id,true);toast(r.status==='accepted'?'You’ve both accepted.':'Accepted. Waiting for the other response.');refresh()}})},
  'decline-intro'(el){modal({title:`Decline this introduction?`,body:`<p>${esc(el.dataset.name)} will only be told that the introduction closed. This can’t be undone.</p>`,confirm:'Decline',danger:true,onConfirm:async()=>{await API.respondProposal(el.dataset.id,false);toast('Introduction closed.');refresh()}})},
  'end-intro'(el){modal({title:`Close your introduction with ${el.dataset.name}?`,body:`<p>The conversation becomes read-only and ${esc(el.dataset.name)} is told it has closed. You can add a private note for your matchmaker.</p><div class="field"><label for="end-reason" class="small"><b>Note to matchmaker</b> <span class="opt">· optional, private</span></label><textarea id="end-reason" maxlength="400"></textarea></div>`,confirm:'Close introduction',danger:true,onConfirm:async ov=>{await API.endConnection(el.dataset.id,ov.querySelector('#end-reason').value);toast('Introduction closed.');go('connections')}})},
  report(el){modal({title:`Report a concern about ${el.dataset.name}`,body:`<p class="small muted">Only administrators see reports. ${esc(el.dataset.name)} isn’t told who reported.</p><div class="field"><label for="rep-reason" class="small"><b>What happened?</b></label><textarea id="rep-reason" maxlength="1000"></textarea></div><label class="switch small"><input type="checkbox" id="rep-block"><span>Also block ${esc(el.dataset.name)}. You won’t see each other, and any introduction closes.</span></label>`,confirm:'Send report',
    onConfirm:async ov=>{const block=ov.querySelector('#rep-block').checked;await API.report(el.dataset.id,ov.querySelector('#rep-reason').value,block);toast('Report sent. Thank you.');if(block)go(S.user.role==='user'?'discover':'mm')}})},
  'delete-account'(){modal({title:'Delete your account?',body:`<p>This permanently removes your profile, criteria, interests and the messages you sent. Open introductions will close. This can’t be undone.</p><div class="field"><label for="del-confirm" class="small"><b>Type your email to confirm</b></label><input id="del-confirm" type="email" autocomplete="off"></div>`,confirm:'Delete everything',danger:true,onConfirm:async ov=>{await API.deleteMyAccount(ov.querySelector('#del-confirm').value);S.user=null;toast('Your account and data were deleted.');go('auth')}})},
  async 'read-all'(){await API.markNotifsRead();refresh()},
  async 'mm-approve'(el){try{await API.approveProfile(el.dataset.id);toast(`${el.dataset.name}’s profile is approved.`);refresh()}catch(e){fail(e)}},
  'mm-changes'(el){modal({title:`Request changes from ${el.dataset.name}`,body:`<p class="small muted">${esc(el.dataset.name)} will see this note on their profile.</p><div class="field"><label for="chg-note" class="small"><b>What should change?</b></label><textarea id="chg-note" maxlength="800"></textarea></div>`,confirm:'Send request',onConfirm:async ov=>{await API.requestChanges(el.dataset.id,ov.querySelector('#chg-note').value);toast('Change request sent.');refresh()}})},
  'mm-advance'(el){const to=el.dataset.to,names=el.dataset.names;
    const cfg={reviewing:{t:'Start reviewing this introduction?',b:`<p>${esc(names)} will be told a matchmaker is reviewing it.</p>`,c:'Start review'},
      proposed:{t:'Propose the introduction',b:`<p class="small muted">Both members read this note and decide whether to accept. Keep it factual and warm. Describe what they share, not whether they should marry.</p><div class="field"><label for="prop-note" class="small"><b>Introduction note</b></label><textarea id="prop-note" maxlength="800"></textarea></div>`,c:'Send proposal'},
      connected:{t:'Open their conversation?',b:`<p>${esc(names)} have both accepted. This opens a private conversation that only the two of them can read.</p>`,c:'Connect'},
      closed:{t:'Close this introduction?',b:`<p>Both members are told it has closed. Add a private reason for the team.</p><div class="field"><label for="close-note" class="small"><b>Private note</b> <span class="opt">· optional</span></label><textarea id="close-note" maxlength="800"></textarea></div>`,c:'Close',d:true}}[to];
    modal({title:cfg.t,body:cfg.b,confirm:cfg.c,danger:cfg.d,onConfirm:async ov=>{const n=ov.querySelector('textarea');await API.advanceIntro(el.dataset.id,to,n?n.value:'');toast(`Moved to ${STATUS_LABEL[to]}.`);refresh()}})},
  'user-status'(el){const to=el.dataset.to;modal({title:`${to==='suspended'?'Suspend':'Reactivate'} ${el.dataset.name}?`,body:to==='suspended'?'<p>They’ll be signed out, removed from discovery, and any open introductions will close.</p>':'<p>They’ll be able to sign in again.</p>',confirm:to==='suspended'?'Suspend':'Reactivate',danger:to==='suspended',onConfirm:async()=>{await API.setUserStatus(el.dataset.id,to);toast(to==='suspended'?'Account suspended.':'Account reactivated.');refresh()}})},
  async 'report-resolve'(el){try{await API.resolveReport(el.dataset.id,el.dataset.to);toast('Report updated.');refresh()}catch(e){fail(e)}},
  'reset-demo'(){modal({title:'Reset all demo data?',body:'<p>Every change made in this browser will be replaced with the original fictional data.</p>',confirm:'Reset',danger:true,onConfirm:async()=>{await API.resetDemo();S.user=null;toast('Demo data restored.');go('auth')}})}
};
const CHANGE={
  filter(el){const k=el.dataset.k;S.filters[k]=el.type==='checkbox'?el.checked:el.value;go('discover',{}, {keep:true})},
  async vis(el){try{await API.setVisibility(el.dataset.k,el.value);toast('Visibility updated.')}catch(e){fail(e);refresh()}},
  async hidden(el){try{const h=await API.setHidden(el.checked);toast(h?'Your profile is hidden from discovery.':'Your profile is visible in discovery again.');refresh()}catch(e){fail(e)}},
  async stage(el){try{await API.setProgress(el.dataset.id,el.value);toast('Stage updated.')}catch(e){fail(e)}},
  async role(el){try{await API.setRole(el.dataset.id,el.value);toast('Role updated.');refresh()}catch(e){fail(e);refresh()}},
  async setting(el){try{S.settings=await API.saveSettings({[el.dataset.k]:el.checked});toast('Setting saved.')}catch(e){fail(e);refresh()}}
};
async function saveStepThen(next){
  const form=document.querySelector('form[data-form=wiz],form[data-form=criteria]');
  const target=next==null?'me':'setup';
  if(!form){if(next==null)return go('me');S.wiz.errors={};return go('setup',{step:next})}
  try{await saveForm(form);S.wiz.errors={};next==null?(toast('Saved.'),go(target)):go('setup',{step:next})}
  catch(e){if(e.fields&&next!==null&&next<+((form.dataset.step)||5)){S.wiz.errors={};go('setup',{step:next});return}if(e.fields){S.wiz.errors=e.fields;refresh()}fail(e)}
}
async function saveForm(form){
  if(form.dataset.form==='criteria'){const c=readCriteria(form);await API.saveMyCriteria(c.items,c.note,c.share);return}
  const{patch,vis,fields}=readWizard(form);
  const errs=validateFields(fields,{...S.wiz.data,...patch});if(Object.keys(errs).length){const e=new ApiError('Some answers need attention.','validation');e.fields=errs;throw e}
  await API.saveMyProfile(patch,vis,+form.dataset.step+1);
}
const FORMS={
  async login(form){const fd=new FormData(form);const email=fd.get('email');try{await API.login(email,fd.get('password'));await boot()}catch(e){go('auth',{mode:'signin',errors:{_:e.message},values:{email}})}},
  async register(form){const fd=new FormData(form);const v={firstName:fd.get('firstName'),email:fd.get('email'),password:fd.get('password'),gender:fd.get('gender'),agree:!!fd.get('agree')};
    try{await API.register(v);await refreshUser();toast('Welcome. Let’s build your profile.');go('setup',{step:0})}catch(e){go('auth',{mode:'register',errors:e.fields||{_:e.message},values:{...v,password:''}});if(!e.fields)fail(e)}},
  async wiz(form){const step=+form.dataset.step;try{await saveForm(form);S.wiz.errors={};go('setup',{step:step+1})}catch(e){if(e.fields){S.wiz.errors=e.fields;await go('setup',{step},{keep:true})}fail(e)}},
  async criteria(form){try{await saveForm(form);S.wiz.errors={};go('setup',{step:6})}catch(e){if(e.fields){S.wiz.errors=e.fields;await go('setup',{step:5},{keep:true})}fail(e)}},
  async send(form){const ta=form.querySelector('textarea'),btn=form.querySelector('button');const text=ta.value;if(!text.trim())return;btn.disabled=true;
    try{const m=await API.send(form.dataset.id,text);ta.value='';const box=$('#msgs');const empty=box.querySelector('.sysmsg:last-child');if(empty&&/No messages yet/.test(empty.textContent))empty.remove();box.insertAdjacentHTML('beforeend',`<div class="msg mine">${esc(m.text)}<time>${clock(m.at)}</time></div>`);box.lastElementChild.scrollIntoView({block:'end'})}catch(e){fail(e)}finally{btn.disabled=false;ta.focus()}},
  async note(form){const t=form.querySelector('textarea').value;try{await API.addNote(form.dataset.subject,t);toast('Note added.');refresh()}catch(e){fail(e)}}
};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!g.disabled){e.preventDefault();let p={};try{p=g.dataset.p?JSON.parse(g.dataset.p):{}}catch(_){}if(S.view!==g.dataset.go||g.dataset.go==='person')S.prev={view:S.view,params:S.params};
    if(S.view==='setup'&&g.dataset.go!=='setup'&&document.querySelector('form[data-form=wiz],form[data-form=criteria]')&&g.closest('.main')){const form=document.querySelector('form[data-form=wiz],form[data-form=criteria]');saveForm(form).catch(()=>{}).finally(()=>go(g.dataset.go,p));return}
    go(g.dataset.go,p);return}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled&&ACT[a.dataset.act]){e.preventDefault();Promise.resolve(ACT[a.dataset.act](a,e)).catch(fail)}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-change]');if(c&&CHANGE[c.dataset.change])CHANGE[c.dataset.change](c)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});

async function refreshUser(){S.user=await API.session();S.settings=S.user?await API.settings():null}
async function boot(){
  await refreshUser();
  if(!S.user)return go('auth');
  if(S.user.role==='user'){if(S.user.profileStatus==='draft')return go('setup',{step:Math.min(S.user.step||0,6)});return go('discover')}
  return go(S.user.role==='admin'?'admin':'mm');
}
(async()=>{app.innerHTML=`<main class="main">${skeleton()}</main>`;try{await Store.init();await boot()}catch(e){console.error(e);app.innerHTML=`<main class="main">${errorState(e)}</main>`}})();
})();
</script>

</body>
</html>
